[project]
name = "zk2-api"
version = "0.1.0"
description = "zk2-chatbot backend"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.19",
    "websockets>=13.1",
    # Validation / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # Cache / queue
    "redis>=5.2.0",
    "arq>=0.26.3",
    # Auth crypto
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "cryptography>=44.0.0",
    "authlib>=1.3.2",
    # HTTP client
    "httpx>=0.28.0",
    # Email
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    # Logging / observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.18.0",
    # Misc
    "click>=8.1.7",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "factory-boy>=3.3.1",
    "faker>=33.1.0",
    "bandit>=1.7.10",
    "types-python-slugify>=8.0.2.20240310",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zk2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "S",            # bandit
    "A",            # builtins
    "C4",           # comprehensions
    "ICN",          # import conventions
    "PIE",          # misc
    "RET",          # return
    "SIM",          # simplify
    "TID",          # tidy imports
    "ARG",          # unused arguments
    "PTH",          # pathlib
    "ERA",          # eradicate (commented code)
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "E501",         # line length (formatter handles)
    "S101",         # assert (used in tests)
    "PLR0913",      # too many arguments
    "PLR2004",      # magic value (often fine)
    "B008",         # function call in default arg (FastAPI pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG"]
"alembic/**" = ["ERA", "RUF"]
"scripts/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "tests/"]

[[tool.mypy.overrides]]
module = ["authlib.*", "pyotp.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure-Python unit tests",
    "integration: require Postgres + Redis (testcontainers)",
    "slow: long-running",
]
