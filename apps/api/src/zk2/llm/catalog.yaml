# Model catalog - the single source of truth for model ids, pricing, context
# windows and capabilities. Nothing about a model belongs in provider code.
#
# Consumers: cost accounting (usage_events, billing), the model selector in the
# UI, and validation of bot settings.
#
# Prices are USD per million tokens. Verify against the provider's own pricing
# page when adding a model; Anthropic and OpenAI both expose a models endpoint
# (GET /v1/models) that reports context windows and output caps.
#
# `max_output_tokens: null` means "not pinned here" - the provider's default applies.

chat:
