# Production shape at a smaller size, so the manifests are exercised before
# they matter.
config:
  APP_ENV: staging
  APP_BASE_URL: https://staging.zk2.example.com
  API_BASE_URL: https://staging.zk2.example.com/api
api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
web:
  replicas: 2
ingress:
  enabled: true
  host: staging.zk2.example.com
podDisruptionBudget:
  enabled: true
networkPolicy:
  enabled: true
serviceMonitor:
  enabled: true
externalSecret:
  enabled: true
  remoteKey: zk2/staging
