{{- if .Values.networkPolicy.enabled }}
{{- /* Default deny, then the traffic the app actually needs. An agent can be
       told to fetch a URL, so egress is a security control here, not hygiene. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zk2.fullname" . }}-default-deny
  labels: {{- include "zk2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zk2.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zk2.fullname" . }}-allow
  labels: {{- include "zk2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zk2.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ .Values.api.port }}
        - port: {{ .Values.web.port }}
  egress:
    {{- range .Values.networkPolicy.allowedEgressPorts }}
    - ports:
        - port: {{ . }}
          protocol: TCP
    {{- end }}
    - ports:
        - port: 53
          protocol: UDP
{{- end }}
