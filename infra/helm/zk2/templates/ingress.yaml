{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zk2.fullname" . }}
  labels: {{- include "zk2.labels" . | nindent 4 }}
  annotations:
    # cert-manager issues the certificate; ExternalDNS publishes the record
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host }}
    # Chat is a WebSocket: the default 60s read timeout would cut answers off
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "zk2.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "zk2.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zk2.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
