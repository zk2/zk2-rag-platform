{{- if .Values.externalSecret.enabled }}
{{- /* Secrets live in a secret manager; the operator syncs them into the
       cluster. Nothing sensitive is in this chart or in the release values. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "zk2.fullname" . }}-secrets
  labels: {{- include "zk2.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "zk2.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $envName, $remoteProperty := .Values.externalSecret.keys }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ $remoteProperty }}
    {{- end }}
{{- end }}
