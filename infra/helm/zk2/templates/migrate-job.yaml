{{- if .Values.migrations.enabled }}
{{- /* A pre-upgrade hook: the schema is migrated before any new pod serves
       traffic, and a failed migration aborts the release instead of leaving
       new code against an old database. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zk2.fullname" . }}-migrate
  labels: {{- include "zk2.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels: {{- include "zk2.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "zk2.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "zk2.image" . }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["alembic", "upgrade", "head"]
          envFrom: {{- include "zk2.envFrom" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
