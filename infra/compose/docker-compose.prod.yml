# Production stack for a single host.
#
# Run it from the repository root so that both the variable file and the build
# context are where this file expects them:
#
#   docker compose --env-file .env.prod -f infra/compose/docker-compose.prod.yml up -d
#
# or through the `prod-*` targets in the Makefile, which do exactly that.
#
# Only the reverse proxy publishes a port to the world; the observability UIs
# bind to loopback, so they are reached over an SSH tunnel rather than being
# put on the internet. Postgres and Redis publish nothing at all.

name: zk2

x-app-env: &app-env
  # Everything the application reads comes from this file; the per-service
  # `environment:` blocks below only override what is specific to running
  # inside compose (service names instead of localhost).
  env_file:
    - ../../.env.prod

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile

x-api-runtime-env: &api-runtime-env
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  # Named volumes, shared by api and worker: the API writes an upload, the
  # worker reads the same bytes back when it indexes the document.
  LOCAL_UPLOAD_DIR: /app/uploads
  HF_HUB_CACHE: /opt/hf
  # Caddy sets X-Forwarded-For, so per-IP limits see the real client
  TRUST_PROXY_HEADERS: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: "1g"
    environment:
      POSTGRES_DB: ${DB_NAME:-zk2}
      POSTGRES_USER: ${DB_USER:-zk2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - maintenance_work_mem=512MB
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zk2} -d ${DB_NAME:-zk2}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue state should survive a restart of the host: an eval run that was
    # queued and then lost is a support ticket nobody can explain.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: every `up` runs migrations to head before api and worker start.
  migrate:
    <<: [*api-image, *app-env]
    image: zk2-api:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-runtime-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*api-image, *app-env]
    image: zk2-api:local
    restart: unless-stopped
    environment:
      <<: *api-runtime-env
    volumes:
      - uploads:/app/uploads
      - hf_models:/opt/hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: [*api-image, *app-env]
    image: zk2-api:local
    restart: unless-stopped
    command: ["arq", "zk2.jobs.WorkerSettings"]
    # The image's healthcheck curls the API's own port, which the worker does
    # not listen on: inherited unchanged it would report unhealthy forever.
    healthcheck:
      disable: true
    environment:
      <<: *api-runtime-env
      OTEL_SERVICE_NAME: zk2-worker
    volumes:
      - uploads:/app/uploads
      - hf_models:/opt/hf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: zk2-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side rewrite target for /api/*. The browser never sees this
      # address - it talks to Caddy, which reaches the API the same way.
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Empty is the safe default: the site block then matches a name nobody
      # can resolve, and Langfuse is reachable over an SSH tunnel only.
      LANGFUSE_HOSTNAME: ${LANGFUSE_HOSTNAME:-langfuse.invalid}
    ports:
      # The only port that leaves this stack. Behind the host's own proxy,
      # ${HTTP_BIND} can be narrowed to the address that proxy comes from.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      # `z` relabels for SELinux, which AlmaLinux and friends enforce by
      # default; on a host without SELinux Docker ignores it.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  # ── Observability (profile: obs) ────────────────────────────
  # `--profile obs` brings these up; without it the stack is application only.

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    restart: unless-stopped
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    ports:
      - "${OBS_BIND:-127.0.0.1}:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [obs]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Loopback-bound and reached over a tunnel, but anonymous read on a
      # dashboard that names hosts and queues is still a gift to whoever
      # finds the tunnel open.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${OBS_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [obs]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${OBS_BIND:-127.0.0.1}:16686:16686"

  # Langfuse v4. The Python SDK sends over OpenTelemetry to /api/public/otel,
  # which only exists from server v3 onwards - paired with the v2 image the app
  # authenticates happily and every trace disappears. That is four containers
  # of infrastructure for one feature, which is what the version buys.
  langfuse-db:
    image: postgres:16-alpine
    profiles: [obs]
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD is required}
    volumes:
      # Deliberately not the old `langfuse_data`: that volume holds a v2 schema
      # and v4 will not migrate onto it. A fresh volume starts clean; the old
      # one keeps whatever was there until somebody prunes it.
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: [obs]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD is required}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Event and media blobs. Nothing publishes it: only Langfuse itself reads and
  # writes here, over the compose network.
  langfuse-minio:
    image: minio/minio:latest
    profiles: [obs]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD is required}
    volumes:
      - langfuse_minio_data:/data
    ports:
      # Only so a browser on the far end of the tunnel can follow a presigned
      # media URL. 9090 is Prometheus's, hence 9092.
      - "${OBS_BIND:-127.0.0.1}:9092:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Langfuse's own queue. Separate from the application's Redis on purpose:
  # its BullMQ queues and our arq jobs have no business sharing an eviction
  # policy, let alone a keyspace.
  langfuse-redis:
    image: redis:7-alpine
    profiles: [obs]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [obs]
    restart: unless-stopped
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD is required}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3030}
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      # Exactly 64 hex characters: openssl rand -hex 32
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD is required}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD is required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}
    depends_on: &langfuse-depends-on
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [obs]
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
      # Self-hosted Langfuse lets anybody register by default. The one account
      # this deployment needs is created by LANGFUSE_INIT_* below, and traces
      # carry prompts and retrieved document text - so the door closes behind
      # it. Flip it to false only long enough to invite somebody.
      AUTH_DISABLE_SIGNUP: ${LANGFUSE_DISABLE_SIGNUP:-true}
      # Presigned media URLs are opened by the browser, which reaches Langfuse
      # through the tunnel - so the address it gets handed has to be the
      # tunnel's, while the server keeps using the compose network.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_MINIO_PUBLIC_URL:-http://localhost:9092}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Applied only against an empty database, on the very first start. It
      # creates the organization, the project and the API keys the application
      # already has in .env.prod, so there is no click-through in the UI and no
      # second restart of api and worker to pick up freshly minted keys.
      LANGFUSE_INIT_ORG_ID: zk2
      LANGFUSE_INIT_ORG_NAME: ZK2
      LANGFUSE_INIT_PROJECT_ID: zk2-rag-platform
      LANGFUSE_INIT_PROJECT_NAME: zk2-rag-platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_ADMIN_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-}
    ports:
      - "${OBS_BIND:-127.0.0.1}:3030:3000"
    depends_on: *langfuse-depends-on

volumes:
  postgres_data:
  redis_data:
  uploads:
  hf_models:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  langfuse_pg_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
